<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./todo.css">
    <title>Document</title>
</head>

<body>
    <section>
        <div class="container">
            <div class="main">
                <div class="task-bar">
                    <i class="fa-solid fa-check"></i>
                    <span>My Tasks</span>
                </div>
                    <div class="date">
                        <p id="date">Date</p>
                    </div>
            </div>
            
            <div class="input-box">
                <input type="text" id="box" placeholder="What do You need to do ?">
                <button id="btn">+</button>
            </div>
            <div class="tabs">
                <button class="tab-btn active">All</button>
                <button class="tab-btn">Active</button>
                <button class="tab-btn">Completed</button>
            </div>
            <div class="content">
                <p id="content-text first" class="tab-content">No Task Here</p>
            </div>
        </div>
        <div class="footer">
            <div class="left-side">
                <span id="items-left">0</span>
                <p>Items Left</p>
            </div>
            <p>Clear completed</p>
        </div>
        </div>
    </section>
    <script src="./todo.js"></script>
</body>

</html>
